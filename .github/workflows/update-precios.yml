name: Update Gas Prices

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest prices
        run: |
          curl -s "https://sedeaplicaciones.minetur.gob.es/ServiciosRESTCarburantes/PreciosCarburantes/EstacionesTerrestres/" -o data/precios.json
          
          # Validate JSON
          if ! python3 -c "import json; json.load(open('data/precios.json'))"; then
            echo "Invalid JSON received, keeping existing file"
            git checkout data/precios.json
            exit 0
          fi

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet data/precios.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/precios.json
          git commit -m "chore: update gas prices $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
